name: release-images

# Build experimental Frostyard platform images. Publishing stays disabled until
# a maintainer sets the repository variable FROSTYARD_PUBLISH_IMAGES=true.
# These are not the upstream images used by the base pull-only Compose files.
# See docs/development/frostyard-releases.md before enabling distribution.
#
# The version tag is read from VERSIONS.md (OTODOCK_VERSION) — the single
# source of truth — a Frostyard suffix and commit SHA distinguish fork artifacts.
# Triggers: manual dispatch, or pushing a release tag (v*).
#
# FIRST-RUN, ONE-TIME (per package): after the first successful push, open
# Packages → <package> → Package settings and (a) set visibility to Public and
# (b) link it to this repository. GHCR packages default to private + unlinked.
# Auth uses the built-in GITHUB_TOKEN (packages: write) — no PAT required.

on:
  workflow_dispatch: {}
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  build:
    # Explicit opt-in in this fork; other forks and upstream cannot publish here.
    if: github.repository == 'frostyard/oto-dock' && vars.FROSTYARD_PUBLISH_IMAGES == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: otodock-proxy
            context: .
            dockerfile: proxy/Dockerfile
          - image: otodock-file-tools
            context: mcps/custom/file-tools-mcp
            dockerfile: mcps/custom/file-tools-mcp/Dockerfile
          - image: otodock-phone
            context: .
            dockerfile: phone/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Resolve pinned versions from VERSIONS.md
        id: meta
        run: |
          platform_version=$(bash scripts/versions.sh OTODOCK_VERSION)
          version="${platform_version}-frostyard.${GITHUB_SHA:0:12}"
          python_image=$(bash scripts/versions.sh PYTHON_IMAGE)
          node_image=$(bash scripts/versions.sh NODE_IMAGE)
          for v in platform_version python_image node_image; do
            if [ -z "${!v}" ]; then
              echo "::error::${v} missing from VERSIONS.md"; exit 1
            fi
          done
          {
            echo "version=$version"
            echo "python_image=$python_image"
            echo "node_image=$node_image"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::building ${{ matrix.image }} -> ghcr.io/frostyard/${{ matrix.image }}:$version"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          # amd64 only for launch; add linux/arm64 here (buildx multi-arch) later.
          platforms: linux/amd64
          push: true
          # file-tools has no version ARGs — the extra build-args are inert there.
          build-args: |
            PYTHON_IMAGE=${{ steps.meta.outputs.python_image }}
            NODE_IMAGE=${{ steps.meta.outputs.node_image }}
          tags: |
            ghcr.io/frostyard/${{ matrix.image }}:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
